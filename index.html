<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CarteDigital</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Firebase SDKs (compat or modular). Aquí usamos compat CDN para simplicidad -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
</head>
<body>
  <header>
    <h1>CarteDigital</h1>
  </header>

  <!-- Auth UI -->
  <section id="auth">
    <h2>Iniciar sesión / Registrarse</h2>
    <input id="email" type="email" placeholder="Correo" />
    <input id="password" type="password" placeholder="Contraseña" />
    <div class="row">
      <button id="signupBtn">Registrarme</button>
      <button id="loginBtn">Iniciar sesión</button>
      <button id="logoutBtn" class="hidden">Cerrar sesión</button>
    </div>
  </section>

  <!-- Contenido -->
  <main id="app" class="not-signed-in">
    <div class="controls">
      <button id="primaryAction" class="needs-auth">Acción principal</button>
      <button id="secondaryAction" class="needs-auth">Otra acción</button>
      <button id="staffBtn" class="staff hidden">Panel Staff</button>
    </div>
    <div id="userInfo" aria-live="polite"></div>
  </main>

  <script>
    // REEMPLAZA con tu config de Firebase
    window.firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROJECT.firebaseapp.com",
      projectId: "TU_PROJECT_ID",
      // demás campos si existen
    };
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
