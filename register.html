<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | CARTE AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #ff0080,
                #8a2be2,
                #00e5ff,
                #00ff88
            );

            -webkit-background-clip: text;
            color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        .card {
            background: #0d0d0d;
            border: 1px solid #242424;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.12);
        }

        h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .description {
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 18px;

            background: #151515;
            border: 1px solid #303030;
            border-radius: 10px;

            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #8a2be2;
            box-shadow: 0 0 0 2px rgba(138, 43, 226, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 11px;

            background: linear-gradient(
                90deg,
                #ff0080,
                #8a2be2,
                #00e5ff
            );

            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            display: none;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            display: block;
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.25);
            color: #00ff88;
        }

        .error {
            display: block;
            background: rgba(255, 0, 80, 0.08);
            border: 1px solid rgba(255, 0, 80, 0.25);
            color: #ff668f;
        }

        .login {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 14px;
        }

        .login a {
            color: #00e5ff;
            text-decoration: none;
            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">CARTE AI</div>

    <div class="subtitle">
        Crea. Edita. Imagina.
    </div>

    <div class="card">

        <h1>Crear cuenta</h1>

        <p class="description">
            Regístrate para comenzar a crear tus videos con CARTE AI.
        </p>

        <form id="registerForm">

            <label for="name">
                Nombre
            </label>

            <input
                type="text"
                id="name"
                placeholder="Tu nombre"
                required
            >

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                placeholder="tucorreo@email.com"
                required
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                placeholder="Mínimo 6 caracteres"
                minlength="6"
                required
            >

            <label for="confirmPassword">
                Confirmar contraseña
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Repite tu contraseña"
                minlength="6"
                required
            >

            <button type="submit" id="registerButton">
                Crear mi cuenta
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="login">
            ¿Ya tienes una cuenta?
            <a href="login.html">
                Iniciar sesión
            </a>
        </div>

    </div>

</div>

<!-- CONEXIÓN CON SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        message.className = "message";
        message.textContent = "";


        // Comprobar contraseñas
        if (password !== confirmPassword) {

            message.className = "message error";

            message.textContent =
                "Las contraseñas no coinciden.";

            return;
        }


        if (password.length < 6) {

            message.className = "message error";

            message.textContent =
                "La contraseña debe tener al menos 6 caracteres.";

            return;
        }


        button.disabled = true;

        button.textContent =
            "Creando cuenta...";


        // Esperar a que Supabase esté disponible
        if (!window.supabaseClient) {

            await new Promise(resolve => {

                const check = setInterval(() => {

                    if (window.supabaseClient) {

                        clearInterval(check);
                        resolve();

                    }

                }, 100);

            });

        }


        try {

            const { data, error } =
                await window.supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            name: name
                        }

                    }

                });


            if (error) {
                throw error;
            }


            message.className =
                "message success";


            message.innerHTML =
                "✅ Cuenta creada correctamente.<br><br>" +
                "Revisa tu correo electrónico para confirmar tu cuenta.";


            form.reset();

        }

        catch (error) {

            console.error(error);

            message.className =
                "message error";

            message.textContent =
                "No se pudo crear la cuenta: " +
                error.message;

        }


        button.disabled = false;

        button.textContent =
            "Crear mi cuenta";

    });

</script>

</body>
</html>
